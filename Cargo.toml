[package]
name = "ccgpt"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Use GPT models from Claude Code through GitHub Copilot or a Responses API"
repository = "https://github.com/jhzhu89/ccgpt"

[dependencies]
async-stream = "0.3"
axum = { version = "0.8", features = ["json"] }
base64 = "0.22"
bytes = "1"
dirs = "6"
dotenvy = "0.15"
eventsource-stream = "0.2"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["http2", "json", "rustls-tls", "stream", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiktoken-rs = "0.12"
tokio = { version = "1", features = ["macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security_Authorization",
] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
